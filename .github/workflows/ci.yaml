name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint chart
        run: helm lint .

      - name: Template chart (catch rendering errors)
        run: helm template mongo-stack .

      - name: Check for common env var typos
        run: |
          echo "Checking for known bad env var names..."
          if grep -r "MONGO_INIT_ROOT" templates/; then
            echo "ERROR: Found MONGO_INIT_ROOT_* — should be MONGO_INITDB_ROOT_*"
            exit 1
          fi
          echo "No known typos found."
